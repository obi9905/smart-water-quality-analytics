name: Smart Water Analytics CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend-and-ml:
    name: Backend Tests & ML Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Raw Dataset Integrity & Schemas
        run: |
          python -m unittest tests/test_raw_data.py

      - name: Execute Analytical API & ML Inference Test Suite
        run: |
          python -m unittest tests/test_api_and_models.py

  build-frontend:
    name: Frontend TypeScript Verification & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run TypeScript Type Check & Vite Production Build
        working-directory: ./frontend
        run: npm run build

  validate-cloud-configs:
    name: BigQuery SQL & Cloud Infrastructure Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify BigQuery SQL Syntax & Table DDL
        run: |
          python -c "
          import os
          sql_files = ['sql/01_create_tables.sql', 'sql/02_etl_water_quality.sql', 'sql/03_etl_reservoir_scarcity.sql', 'sql/04_ml_models.sql']
          for f in sql_files:
              assert os.path.exists(f), f'Missing SQL file: {f}'
              with open(f) as fp:
                  content = fp.read()
                  assert 'smart-water-analytics-512816' in content, f'Missing GCP project reference in {f}'
          print('All BigQuery SQL definitions validated successfully.')
          "
